services:
  container:
    image: ghcr.io/taoli-tools/taoli-tools-container:rustdesk
    init: true
    security_opt:
      - seccomp=/etc/docker/seccomp.json
    ulimits:
      nofile:
        soft: 65535
        hard: 100000
    ports:
      - target: 21118
        published: 21118
        protocol: tcp
        mode: host
    volumes:
      - data:/home/taoli/data
      - rustdesk:/home/rustdesk/.config/rustdesk
      - /mnt:/home/taoli/cert
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 268435456
    environment:
      RUSTDESK_ID_SERVER: ${RUSTDESK_ID_SERVER:-}
      RUSTDESK_RELAY_SERVER: ${RUSTDESK_RELAY_SERVER:-}
      RUSTDESK_API_SERVER: ${RUSTDESK_API_SERVER:-}
      RUSTDESK_SERVER_KEY: ${RUSTDESK_SERVER_KEY:-}
    secrets:
      - source: RUSTDESK_PASSWORD
        target: RUSTDESK_PASSWORD
        uid: "0"
        gid: "0"
        mode: 0400
    networks:
      - public
      - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        # RustDesk's identity database must not be opened by two tasks at once.
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

  signer:
    image: ghcr.io/taoli-tools/taoli-tools-signer:latest
    security_opt:
      - seccomp=/etc/docker/seccomp.json
    secrets:
      - KEYCHAIN
      - CERT.pem
      - KEY.pem
    networks:
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

networks:
  public:
    driver: overlay
    attachable: true
  private:
    driver: overlay
    attachable: true
    internal: true

volumes:
  data:
    driver: local
  rustdesk:
    driver: local

secrets:
  RUSTDESK_PASSWORD:
    external: true
    name: ${RUSTDESK_PASSWORD_SECRET_NAME:-taoli_tools_RUSTDESK_PASSWORD}
  KEYCHAIN:
    external: true
    name: taoli_tools_KEYCHAIN
  CERT.pem:
    external: true
    name: taoli_tools_CERT.pem
  KEY.pem:
    external: true
    name: taoli_tools_KEY.pem
