services:
  container:
    image: ghcr.io/taoli-tools/taoli-tools-container:rustdesk
    init: true
    shm_size: 256m
    ulimits:
      nofile:
        soft: 65535
        hard: 100000
    ports:
      - target: 21118
        published: 21118
        protocol: tcp
        mode: ingress
    volumes:
      - data:/home/taoli/data
      - rustdesk:/root/.config/rustdesk
      - /mnt:/home/taoli/cert
    secrets:
      - source: RUSTDESK_PASSWORD
        target: RUSTDESK_PASSWORD
        uid: "0"
        gid: "0"
        mode: 0400
    networks:
      - public
      - private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        # RustDesk's identity database must not be opened by two tasks at once.
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

  signer:
    image: ghcr.io/taoli-tools/taoli-tools-signer:latest
    secrets:
      - KEYCHAIN
      - CERT.pem
      - KEY.pem
    networks:
      - private
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 0s
      update_config:
        order: start-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first

networks:
  public:
    driver: overlay
    attachable: true
  private:
    driver: overlay
    attachable: true
    internal: true

volumes:
  data:
    driver: local
  rustdesk:
    driver: local

secrets:
  RUSTDESK_PASSWORD:
    external: true
    name: taoli_tools_RUSTDESK_PASSWORD
  KEYCHAIN:
    file: keychain.toml
  CERT.pem:
    file: CERT.pem
  KEY.pem:
    file: KEY.pem
